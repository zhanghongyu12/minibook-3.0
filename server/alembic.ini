[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# NOTE: keep this file ASCII-only -- alembic's configparser reads it with the
# locale encoding (cp936 on this machine), so non-ASCII comments break on Windows.
# sqlalchemy.url is intentionally empty here: alembic/env.py injects it from
# .env / environment variables (DEC-031 dual DSN).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
